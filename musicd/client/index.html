<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- viewport-fit=cover is load-bearing and pairs with
         apple-mobile-web-app-status-bar-style=black-translucent below.
         black-translucent shifts the document UP under the status bar but
         does NOT grow the layout viewport, so on its own it leaves a gap at
         the BOTTOM the size of the TOP inset (44-62px) and pushes the top
         controls out of reach. viewport-fit=cover grows the viewport to the
         full display so the two agree. Both sibling builds that fill the
         screen correctly (MusicD-Remote, MusicD-Server-Bridge) carry it;
         this build did not, which is what the gap was.
         Keep exactly ONE viewport meta — a second silently overrides the
         first and zeroes every env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MusicD</title>

    <!-- PWA wiring (#v1.1.0.3) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="MusicD" />
    <!-- iOS Safari: support standalone mode + apple touch icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MusicD" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Service worker registration (#v1.1.0.3). Loaded only after the
         page is fully parsed; failure is silent because PWA is a
         progressive enhancement, not a requirement. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (e) {
            console.warn('SW registration failed:', e);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
